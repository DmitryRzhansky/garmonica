<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta_title }}</title>
    <meta name="description" content="{{ meta_description }}">
    {% if canonical %}
    <link rel="canonical" href="{{ canonical }}">
    {% endif %}
    <meta property="og:title" content="{{ meta_title }}">
    <meta property="og:description" content="{{ meta_description }}">
    {% if canonical %}
    <meta property="og:url" content="{{ canonical }}">
    {% endif %}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ clinic_contacts.brand }}">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:image" content="{{ request.host_url.rstrip('/') }}/assets/images/logo.webp">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="Нова — клиника психиатрии и наркологии">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ meta_title }}">
    <meta name="twitter:description" content="{{ meta_description }}">
    <meta name="twitter:image" content="{{ request.host_url.rstrip('/') }}/assets/images/logo.webp">
    {% if json_ld %}
    <script type="application/ld+json">{{ json_ld|safe }}</script>
    {% endif %}
    <link rel="icon" href="/assets/images/logo-mark.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/main.css?v=20261011-02">
  </head>
  <body>
    {% include "components/header.html" %}
    {% block content %}{% endblock %}
    {% include "components/footer.html" %}
    <script src="/assets/js/modules/menu.js" defer></script>
    <script src="/assets/js/modules/services-menu.js" defer></script>
    <script src="/assets/js/modules/contact-form.js?v=20261009-45" defer></script>
    <script src="/assets/js/modules/service-call-form.js" defer></script>
    <script src="/assets/js/modules/reviews.js?v=20261009-48" defer></script>
    <script src="/assets/js/modules/prices.js?v=20261010-01" defer></script>
    <script src="/assets/js/modules/doctors.js?v=20261009-27" defer></script>
    <script src="/assets/js/modules/licenses.js?v=20261010-01" defer></script>
    <script src="/assets/js/modules/clinic-gallery.js" defer></script>
    <script src="/assets/js/modules/about-slider.js" defer></script>
    <script src="/assets/js/modules/faq.js?v=20261009-44" defer></script>
    <script src="/assets/js/data/specialist-directions.js" defer></script>
    <script src="/assets/js/data/specialist-questions.js" defer></script>
    <script src="/assets/js/data/specialists.js" defer></script>
    <script src="/assets/js/modules/specialist-matching.js" defer></script>
    <script src="/assets/js/modules/specialist-views.js" defer></script>
    <script src="/assets/js/modules/specialist-dialog.js" defer></script>
    <script src="/assets/js/modules/specialist-quiz.js" defer></script>
    <script src="/assets/js/modules/field-service.js?v=20261009-40" defer></script>
    <script src="/assets/js/main.js" defer></script>
  </body>
</html>
