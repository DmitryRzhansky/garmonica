{% extends "base.html" %}

{% block content %}
    <main id="top">
      <section class="error-page" aria-labelledby="error-page-title">
        <div class="container error-page__inner">
          <p class="error-page__code" aria-hidden="true">404</p>
          <h1 class="error-page__title" id="error-page-title">Страница не найдена</h1>
          <div class="error-page__actions">
            <a class="button button--primary" href="/">
              <img
                class="button__icon"
                src="/assets/icons/phosphor/house-line.svg"
                alt=""
                width="16"
                height="16"
                decoding="async"
              >
              На главную
            </a>
          </div>
        </div>
      </section>
    </main>
{% endblock %}
